    properties:
      application_platform:
        type: string
      company:
        type: string
      cover_letter_url:
        type: string
      date_applied:
        type: string
      date_assessed:
        type: string
      date_found:
        type: string
      date_posted:
        type: string
      interview_round:
        type: integer
      location:
        type: string
      notes:
        type: string
      resume_url:
        type: string
      source:
        type: string
      stage:
        type: string
      status:
        type: string
      title:
        type: string
