basePath: /
definitions:
  server.CreateJobRequest:
    properties:
      company:
        type: string
      position:
        type: string
      status:
        type: string
    type: object
  server.ErrorResponse:
    properties:
      error:
        example: company and position are required
        type: string
    type: object
  server.JobResponse:
    properties:
      company:
        type: string
      id:
        type: integer
      position:
        type: string
      status:
        type: string
    type: object
  server.UpdateJobRequest:
    properties:
      company:
        type: string
      position:
        type: string
      status:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API for tracking job applications.
  title: Job Tracker API
  version: "0.1"
paths:
  /jobs:
    get:
      description: Retrieve a list of all tracked jobs
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/server.JobResponse'
            type: array
      summary: Get all jobs
      tags:
      - jobs
    post:
      consumes:
      - application/json
      description: Submit a new job application to track
      parameters:
      - description: Job details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/server.CreateJobRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/server.JobResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: Create a new job
      tags:
      - jobs
  /jobs/{id}:
    delete:
      description: Remove a tracked job by ID
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete a job
      tags:
      - jobs
    put:
      consumes:
      - application/json
      description: Update an existing job by ID
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: integer
      - description: Update job data
        in: body
        name: job
        required: true
        schema:
          $ref: '#/definitions/server.UpdateJobRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.JobResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update a job
      tags:
      - jobs
swagger: "2.0"
