host: localhost:8080
info:
  contact: {}
  description: API for tracking job applications.
  title: Job Tracker API
  version: "0.2"
paths:
  /health:
    get:
      description: Verify that the API server is up and running
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Health Check
      tags:
      - health
  /jobs:
    get:
      description: Retrieve a list of all tracked jobs with assessment summaries and
        note counts
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/server.JobResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: Get all jobs
      tags:
      - jobs
    post:
      consumes:
      - application/json
      description: Submit a new job application to track
      parameters:
      - description: Job details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/server.CreateJobRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/server.JobResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: Create a new job
      tags:
      - jobs
  /jobs/{id}:
    delete:
      description: Remove a tracked job by ID
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: Delete a job
      tags:
      - jobs
    put:
      consumes:
      - application/json
      description: Update an existing job by ID
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: integer
      - description: Update job data
        in: body
        name: job
        required: true
        schema:
          $ref: '#/definitions/server.UpdateJobRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.JobResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: Update a job
      tags:
      - jobs
  /jobs/{id}/assessment:
    get:
      description: Retrieve the assessment details and score for a job
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.AssessmentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: Get job assessment
      tags:
      - assessments
    put:
      consumes:
      - application/json
      description: Calculate weighted score, save assessment for a job, and mark the
        job as assessed
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: integer
      - description: Assessment scores
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/server.AssessmentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.AssessmentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: Save or update job assessment
      tags:
      - assessments
  /jobs/{id}/notes:
    get:
      description: Retrieve all sectioned notes associated with a specific job
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/server.JobNoteResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: List notes for a job
      tags:
      - notes
    post:
      consumes:
      - application/json
      description: Add a new sectioned note to a tracked job
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: integer
      - description: Note details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/server.CreateJobNoteRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/server.JobNoteResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: Create a note for a job
      tags:
      - notes
  /jobs/{id}/notes/{noteId}:
    delete:
      description: Remove a note belonging to a specific job
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: integer
      - description: Note ID
        in: path
        name: noteId
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: Delete a job note
      tags:
      - notes
    put:
      consumes:
      - application/json
      description: Update an existing note belonging to a specific job
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: integer
      - description: Note ID
        in: path
        name: noteId
        required: true
        type: integer
      - description: Updated note details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/server.UpdateJobNoteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.JobNoteResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: Update a job note
      tags:
      - notes
swagger: "2.0"
