      geographic_alignment:
        type: integer
      growth_value:
        type: integer
      technical_alignment:
        type: integer
      work_arrangement_score:
        type: integer
    type: object
  server.AssessmentResponse:
    properties:
      career_alignment:
        type: integer
      compensation_score:
        type: integer
      experience_match:
        type: integer
      geographic_alignment:
        type: integer
      growth_value:
        type: integer
      job_id:
        type: integer
      recommendation:
        type: string
      technical_alignment:
