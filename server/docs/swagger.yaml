basePath: /
definitions:
  server.AssessmentRequest:
    properties:
      career_alignment:
        type: integer
      compensation_score:
        type: integer
      experience_match:
        type: integer
      geographic_alignment:
        type: integer
      growth_value:
        type: integer
      technical_alignment:
        type: integer
      work_arrangement_score:
        type: integer
    type: object
  server.AssessmentResponse:
    properties:
      career_alignment:
        type: integer
      compensation_score:
        type: integer
      experience_match:
        type: integer
      geographic_alignment:
        type: integer
      growth_value:
        type: integer
      job_id:
        type: integer
      recommendation:
        type: string
      technical_alignment:
        type: integer
      total_score:
        type: integer
      work_arrangement_score:
        type: integer
    type: object
  server.CreateJobRequest:
    properties:
      company:
        type: string
      location:
        type: string
      notes:
        type: string
      stage:
        type: string
      status:
        type: string
      title:
        type: string
      url:
        type: string
      work_arrangement:
        type: string
    type: object
  server.ErrorResponse:
    properties:
      error:
        example: company and position are required
        type: string
    type: object
  server.JobResponse:
    properties:
      company:
        type: string
      id:
        type: integer
      location:
        type: string
      notes:
        type: string
      stage:
        type: string
      status:
        type: string
      title:
        type: string
      url:
        type: string
      work_arrangement:
        type: string
    type: object
  server.UpdateJobRequest:
    properties:
      company:
        type: string
      location:
        type: string
      notes:
        type: string
      stage:
        type: string
      status:
        type: string
      title:
        type: string
      url:
        type: string
      work_arrangement:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API for tracking job applications.
  title: Job Tracker API
  version: "0.2"
paths:
  /health:
    get:
      description: Verify that the API server is up and running
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Health Check
      tags:
      - health
  /jobs:
    get:
      description: Retrieve a list of all tracked jobs
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/server.JobResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: Get all jobs
      tags:
      - jobs
    post:
      consumes:
      - application/json
      description: Submit a new job application to track
      parameters:
      - description: Job details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/server.CreateJobRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/server.JobResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: Create a new job
      tags:
      - jobs
  /jobs/{id}:
    delete:
      description: Remove a tracked job by ID
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: Delete a job
      tags:
      - jobs
    put:
      consumes:
      - application/json
      description: Update an existing job by ID
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: integer
      - description: Update job data
        in: body
        name: job
        required: true
        schema:
          $ref: '#/definitions/server.UpdateJobRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.JobResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: Update a job
      tags:
      - jobs
  /jobs/{id}/assessment:
    get:
      description: Retrieve the assessment details and score for a job
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.AssessmentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: Get job assessment
      tags:
      - assessments
    put:
      consumes:
      - application/json
      description: Calculate weighted score and save assessment for a job
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: integer
      - description: Assessment scores
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/server.AssessmentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.AssessmentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: Save or update job assessment
      tags:
      - assessments
swagger: "2.0"
